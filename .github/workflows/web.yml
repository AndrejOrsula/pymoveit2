name: Web demo

on:
  push:
    branches:
      - main
      - web
  pull_request:
    branches:
      - web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || 'web' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'AndrejOrsula/pymoveit2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: web
          fetch-depth: 0
      - name: Merge main into web
        id: merge
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${SOURCE_SHA}" HEAD; then
            echo "web already contains main at ${SOURCE_SHA}."
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -m "Merge main (${SOURCE_SHA::7}) into web" "${SOURCE_SHA}"
          git push origin HEAD:web
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build:
    needs: sync
    if: ${{ !cancelled() && (needs.sync.outputs.sha != '' || (needs.sync.result == 'skipped' && github.ref != 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit and lesson tests
        run: npm test
      - name: Python examples (Pyodide)
        run: npm run test:python
      - name: Build
        run: npm run build -- --out "${{ runner.temp }}/site"
      - name: Browser tests
        env:
          DEMO_SITE: ${{ runner.temp }}/site
          DEMO_EVIDENCE: ${{ runner.temp }}/evidence
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: web-demo-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-demo-site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main", "refs/heads/web"]'), github.ref) && github.repository == 'AndrejOrsula/pymoveit2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web-demo-site
          path: ${{ runner.temp }}/pages
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
